<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Termostat ESP32</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
    .card { display: inline-block; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    h1 { color: #333; margin-bottom: 20px; }
    .status { font-size: 1.2em; margin: 15px 0; }
    .ON { color: #28a745; font-weight: bold; }
    .OFF { color: #dc3545; font-weight: bold; }
    input[type=number] { padding: 8px; width: 80px; font-size: 1em; border: 1px solid #ccc; border-radius: 4px; }
    input[type=submit] { padding: 8px 15px; font-size: 1em; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    input[type=submit]:hover { background-color: #0056b3; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Termostat Inteligent ESP32</h1>
    <p class="status"><strong>Temperatura curentă:</strong> %TEMP% &deg;C</p>
    <p class="status"><strong>Umiditate curentă:</strong> %UMID% %</p>
    <p class="status"><strong>Stare ventilator/LED:</strong> <span class="%STARE_CLASA%">%STARE_TEXT%</span></p>
    <p class="status"><strong>Prag setat în prezent:</strong> %PRAG% &deg;C</p>

    <form action="/set" method="GET">
      <label>Setează prag nou (&deg;C): </label>
      <input type="number" step="0.5" name="prag" value="%PRAG%" required>
      <input type="submit" value="Aplică">
    </form>

    <br><br>
    <a href="/"><button style="padding: 6px 12px; cursor:pointer;">Reîmprospătează pagina</button></a>
  </div>
</body>
</html>
